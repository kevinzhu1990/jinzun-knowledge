name: Apply product corrections

on:
  push:
    branches:
      - fix/product-2608-correction

permissions:
  contents: write

jobs:
  correct-product-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: fix/product-2608-correction
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify correction behavior
        run: node tests/test_product_data_corrections.js

      - name: Apply corrections to deployed product bank
        run: node scripts/apply_product_corrections.js

      - name: Verify generated product bank
        run: |
          python scripts/verify_product_quiz.py
          python -m pytest tests/test_product_corrections.py -v

      - name: Commit corrected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/product_quiz assets/product-images/daily/2608.jpg package.json scripts/apply_product_corrections.js tests/test_product_data_corrections.js
          git rm --ignore-unmatch assets/product-images/daily/2576.jpg
          if git diff --cached --quiet; then
            echo "No generated corrections to commit."
            exit 0
          fi
          git commit -m "fix: publish corrected product data"
          git push origin HEAD:fix/product-2608-correction
